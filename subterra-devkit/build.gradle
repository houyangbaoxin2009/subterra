// p.2.4.5: engine.network.crypto — x25519 + SHA-256 KDF → AES-256-GCM (12B nonce = 8B BE seq
// + 4B zero, same-key never repeats), round-trip / tamper-reject / wrong-key-reject, LAN-
// trustable toggle (default on, L3 strategy hookup). Pure JVM.
def networkCryptoProbe = tasks.register('runNetworkCryptoProbe', JavaExec) {
    group = 'verification'
    description = 'p.2.4.5: run the engine.network.crypto probe (x25519+AEAD, LAN-trust toggle, pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.NetworkCryptoProbe'
}

// p.2.4.6: E2E gate — boots the dev server with the enhanced-channel gated shell enabled
// (-Dsubterra.probe.network) and asserts the deterministic markers ([Subterra network]) at
// ServerStartedEvent. Event-based, never timing-based, like the other E2E gates.
def networkE2EProbe = tasks.register('runNetworkE2EProbe', JavaExec) {
    group = 'verification'
    description = 'p.2.4.6: boot dev server, fire the gated enhanced-channel shell, assert markers (E2E gate)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.NetworkE2EProbe'
    workingDir = rootProject.projectDir
    systemProperty 'subterra.projectDir', rootProject.projectDir.absolutePath
}
// Fourth boot gate: forks the same gradlew runServer on the same run/world as
// bootProbe / datapackE2EProbe / saveE2EProbe — never boot concurrently (DirectoryLock on session.lock).
networkE2EProbe.configure { mustRunAfter saveE2EProbe }

// p.2.5.1: P2P decentralised-network feasibility benchmark — quantifies the zd payload
// channel (encoding volume ratio, encode/decode throughput ops/ms, tink v2 frame overhead,
// and a combined zd->FrameV2(strong)->parse->zd-decode round-trip). Pure JVM, no MC runtime,
// no native access; figures are recorded (never asserted), deterministic checks gate it.
def p2pChannelBenchmarkProbe = tasks.register('runP2pChannelBenchmarkProbe', JavaExec) {
    group = 'verification'
    description = 'p.2.5.1: run the P2P zd-channel feasibility benchmark probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.P2pChannelBenchmarkProbe'
}

