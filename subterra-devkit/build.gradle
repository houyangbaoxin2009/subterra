plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Probes exercise the launch layer standalone (pure JVM, no Minecraft runtime).
// p.2.0: devkit absorbs the probes module; never shipped in the main mod jar.
dependencies {
    // launch/fix classes now live in the root source-host sourceSet; one-way file
    // dep (root jar excludes devkit -> no cycle).
    implementation rootProject.sourceSets.main.output
    implementation project(':subterra-api')
    implementation project(':subterra-engine')
    implementation project(':subterra-migrate')
}

// Deterministic acceptance: exit 0 = PASS, exit 1 = FAIL. Never shipped.
def launchProbe = tasks.register('runLaunchProbe', JavaExec) {
    group = 'verification'
    description = 'Run the L1 launch-layer deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.LaunchLayerProbe'
}

