// End-to-end gate: boots the dev server on the Java 25 toolchain and asserts
// the boot contract from the log. Event-based, never timing-based.
def bootProbe = tasks.register('runBootProbe', JavaExec) {
    group = 'verification'
    description = 'Boot the dev server on Java 25 and assert the L1/L2 boot contract (E2E gate)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.ServerBootProbe'
    workingDir = rootProject.projectDir
    systemProperty 'subterra.projectDir', rootProject.projectDir.absolutePath
}

