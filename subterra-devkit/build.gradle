// p.1.8.30: world-generator acceptance built on the World Profiler module — boots the
// dev server with a deterministic seed + preset, force-generates the window, writes
// statistics + an axial slice report, then reaps the game (kept OUT of probeAcceptance:
// it generates real chunks and is a dev-loop tool, not a boot gate).
def worldProfileAcceptance = tasks.register('runWorldProfileAcceptance', JavaExec) {
    group = 'verification'
    description = 'p.1.8.30: boot dev server, force-generate window, profiler stats + slice acceptance'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.WorldProfileAcceptanceProbe'
    workingDir = rootProject.projectDir
    systemProperty 'subterra.projectDir', rootProject.projectDir.absolutePath
    systemProperty 'subterra.seed', System.getProperty('subterra.seed', project.findProperty('subterra.seed') ?: '44905237')
    systemProperty 'subterra.levelType', System.getProperty('subterra.levelType', project.findProperty('subterra.levelType') ?: 'subterra:subterra')
    systemProperty 'subterra.profileRadius', System.getProperty('subterra.profileRadius', project.findProperty('subterra.profileRadius') ?: '2')
    systemProperty 'subterra.profileBuild', System.getProperty('subterra.profileBuild', project.findProperty('subterra.profileBuild') ?: 'true')
    systemProperty 'subterra.profileSlice', System.getProperty('subterra.profileSlice', project.findProperty('subterra.profileSlice') ?: '')
    systemProperty 'subterra.profileCenter', System.getProperty('subterra.profileCenter', project.findProperty('subterra.profileCenter') ?: '4000,4000')
    systemProperty 'subterra.perfCount', System.getProperty('subterra.perfCount', project.findProperty('subterra.perfCount') ?: 'true')
}

// p.2.0.10: dependency iron-law probe — scans compiled class constant pools and
// enforces api <- engine <- runtime / migrate layering (api/engine/migrate never
// reference MC; engine/migrate never reference runtime; no duplicate FQCN across
// roots). Pure JDK, runs off the compiled outputs of the scanned roots.
def ironLawProbe = tasks.register('runIronLawProbe', JavaExec) {
    group = 'verification'
    description = 'p.2.0.10: enforce api<-engine<-runtime / migrate iron law on compiled class outputs (constant-pool scan)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.IronLawProbe'
    args = [
        'api',     rootProject.project(':subterra-api').sourceSets.main.output.classesDirs.asPath,
        'engine',  rootProject.project(':subterra-engine').sourceSets.main.output.classesDirs.asPath,
        'runtime', rootProject.sourceSets.main.output.classesDirs.asPath,
        'migrate', rootProject.project(':subterra-migrate').sourceSets.main.output.classesDirs.asPath,
    ]
}
ironLawProbe.configure {
    dependsOn rootProject.tasks.named('classes'),
              rootProject.project(':subterra-api').tasks.named('classes'),
              rootProject.project(':subterra-engine').tasks.named('classes'),
              rootProject.project(':subterra-migrate').tasks.named('classes')
}

// p.2.1: tie bridge 确定性探针 —— tiec 编译的 DLL → Java 25 FFM downcall（真实 ABI 调用链）。
// 资源自包含（resources/tie/tiefib_probe.{tie,dll}）；FFM 受限方法需显式 native access。
def tieBridgeProbe = tasks.register('runTieBridgeProbe', JavaExec) {
    group = 'verification'
    description = 'p.2.1: run the tie bridge probe (tiec DLL -> Java FFM, pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.TieBridgeProbe'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

// p.2.2: datapack 确定性探针 —— td 纯直载（目录扫描 + pack.td manifest）→ 注册表 →
// pack.td tie 声明 → TieLibrary FFM 调用。资源自包含（resources/datapack/mini_dp +
// resources/tie/dp_logic_probe.{tie,dll}）；FFM 受限方法需显式 native access。
def datapackProbe = tasks.register('runDatapackProbe', JavaExec) {
    group = 'verification'
    description = 'p.2.2: run the datapack probe (td direct loading + tie logic chain, pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.DatapackProbe'
    jvmArgs += ['--enable-native-access=ALL-UNNAMED']
}

// p.2.2 block 2: E2E gate — boots the dev server with the seed td datapack
// staged under run/datapacks and asserts the registration chain (tags / lang /
// recipes into the live RecipeManager / tie functions called) from the log.
// Event-based like bootProbe, never timing-based.
def datapackE2EProbe = tasks.register('runDatapackE2EProbe', JavaExec) {
    group = 'verification'
    description = 'p.2.2: boot dev server, load seed td datapack, assert registration (E2E gate)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.DatapackE2EProbe'
    workingDir = rootProject.projectDir
    systemProperty 'subterra.projectDir', rootProject.projectDir.absolutePath
}
// Both boot gates fork `gradlew runServer` on the same run/world — they must
// never boot concurrently (DirectoryLock on session.lock), so E2E runs after
// bootProbe. mustRunAfter keeps each individually runnable.
datapackE2EProbe.configure { mustRunAfter bootProbe }

