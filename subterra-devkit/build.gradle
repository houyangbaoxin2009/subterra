// p.2.4.4: engine.network.bandwidth — bandwidth-cuts optimizer: three quantified techniques
// + argmax selection (fixed-enum order breaks ties), deterministic hit counts, L3-encryption
// fit via LAN-trustable toggle. Pure JVM.
def networkOptimizerProbe = tasks.register('runNetworkOptimizerProbe', JavaExec) {
    group = 'verification'
    description = 'p.2.4.4: run the engine.network.bandwidth optimizer probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
