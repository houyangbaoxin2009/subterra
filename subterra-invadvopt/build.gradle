plugins {
    id 'java-library'
    // MC-layer port: the accelerator targets server-side advancement trigger
    // classes, so this module compiles against the NeoForge/Minecraft classpath
    // generated by ModDevGradle (no runs/mods: it ships inside the Subterra jar).
    id 'net.neoforged.moddev' version '2.0.146'
}

group = rootProject.group
version = rootProject.version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
