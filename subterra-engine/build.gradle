plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

// p.2.1: toolchain 25 — engine.tie 用稳定 FFM（java.lang.foreign，JDK22+）与 root 一致。
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Pure-JDK engine: aggregated into the main mod jar, never touches the MC
// classpath. Iron-law dependency direction: engine depends only on api.
dependencies {
    implementation project(':subterra-api')
    // p.2.3.8: the zd carrier codec moved to the standalone org.tielang:zd-java library
    // (composite build from ../../tie-repo/zd-java); api so consumers (runtime, devkit)
    // see org.tielang.zd types through the engine.
    api 'org.tielang:zd-java:0.2.0'
}
