pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Modular monolith: subterra-api publishes standalone; the rest coalesce into the main mod jar.
// p.2.0 re-layout: engine (pure JDK) + migrate/devkit (never shipped); the runtime layer is a
// source-host directory mounted into the root main sourceSet (not a Gradle subproject).
include 'subterra-api'
include 'subterra-engine'
include 'subterra-migrate'
include 'subterra-devkit'
// p.2.35 tie bridge module: pure-JDK, bundles the Trimand DLL (/tie/subterra_diffuse.dll)
// and the self-contained FFM bridge (io.toterra.subterra.tie.TrimandBridge).
include 'subterra-tie'
// p.2.20.3 official sample: minimal framework consumer (pure-JDK library shape;
// MC assembly stays in the root project).
include 'samples:overturn-minimal'

rootProject.name = 'subterra'