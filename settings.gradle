pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Modular monolith: subterra-api publishes standalone; the rest coalesce into the main mod jar.
include 'subterra-launch'
include 'subterra-compat'
include 'subterra-api'
include 'subterra-optim'
include 'subterra-tie'
include 'subterra-config'
include 'subterra-log'
include 'subterra-probes'
include 'subterra-profiler'

rootProject.name = 'subterra'