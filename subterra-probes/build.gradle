plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Probes exercise the launch layer standalone (pure JVM, no Minecraft runtime).
dependencies {
    implementation project(':subterra-launch')
    implementation project(':subterra-compat')
    implementation project(':subterra-api')
    implementation project(':subterra-optim')
    implementation project(':subterra-config')
    implementation project(':subterra-log')
}

// Deterministic acceptance: exit 0 = PASS, exit 1 = FAIL. Never shipped.
def launchProbe = tasks.register('runLaunchProbe', JavaExec) {
    group = 'verification'
    description = 'Run the L1 launch-layer deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.LaunchLayerProbe'
}

def launchArgsProbe = tasks.register('runLaunchArgsProbe', JavaExec) {
    group = 'verification'
    description = 'Run the L1 JVM-argument-package deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.LaunchArgsProbe'
}

def compatProbe = tasks.register('runCompatProbe', JavaExec) {
    group = 'verification'
    description = 'Run the L2 compatibility-registry deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.CompatProbe'
}

def apiProbe = tasks.register('runApiProbe', JavaExec) {
    group = 'verification'
    description = 'Run the L3 API-library deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.ApiProbe'
}

def poolProbe = tasks.register('runPoolProbe', JavaExec) {
    group = 'verification'
    description = 'Run the optim object-pool deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.ScratchPoolProbe'
}

def configProbe = tasks.register('runConfigProbe', JavaExec) {
    group = 'verification'
    description = 'Run the td-configuration deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.ConfigProbe'
}

def logProbe = tasks.register('runLogProbe', JavaExec) {
    group = 'verification'
    description = 'Run the logging + diagnostics deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.LogProbe'
}

// End-to-end gate: boots the dev server on the Java 25 toolchain and asserts
// the boot contract from the log. Event-based, never timing-based.
def bootProbe = tasks.register('runBootProbe', JavaExec) {
    group = 'verification'
    description = 'Boot the dev server on Java 25 and assert the L1/L2 boot contract (E2E gate)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.ServerBootProbe'
    workingDir = rootProject.projectDir
    systemProperty 'subterra.projectDir', rootProject.projectDir.absolutePath
}

tasks.register('probeAcceptance') {
    group = 'verification'
    description = 'Run all acceptance probes (pure-JVM + end-to-end boot gate)'
    dependsOn launchProbe, launchArgsProbe, compatProbe, apiProbe, poolProbe, configProbe, logProbe, bootProbe
}
