plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Probes exercise the launch layer standalone (pure JVM, no Minecraft runtime).
dependencies {
    implementation project(':subterra-launch')
}

// Deterministic acceptance: exit 0 = PASS, exit 1 = FAIL. Never shipped.
def launchProbe = tasks.register('runLaunchProbe', JavaExec) {
    group = 'verification'
    description = 'Run the L1 launch-layer deterministic probe (pure JVM)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.probes.LaunchLayerProbe'
}

tasks.register('probeAcceptance') {
    group = 'verification'
    description = 'Run all acceptance probes'
    dependsOn launchProbe
}
