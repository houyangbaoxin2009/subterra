plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Logging module: pure JDK (no Minecraft runtime), td-config driven via
// subterra-engine (config lives at engine.config); the mini-AI analyzer is
// opt-in and stays unbound by default.
dependencies {
    implementation project(':subterra-engine')
}