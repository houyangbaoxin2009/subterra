plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Modular monolith: the root project is the shipped mod jar and coalesces
// submodule outputs; only subterra-api additionally publishes a standalone jar.
subprojects {
    // All submodules stay on the Java 21 toolchain of the main mod.
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// The shipped mod jar aggregates all submodule class outputs (one mod jar).
// subterra-devkit and subterra-migrate are acceptance/dev-only and never shipped
// (design doc §5.1); only subterra-api + subterra-engine class outputs are coalesced.
tasks.named('jar') {
    from { subprojects.findAll { it.name != 'subterra-devkit' && it.name != 'subterra-migrate' }.collect { it.sourceSets.main.output } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// MC-layer source host: ports that target Minecraft/NeoForge classes cannot
// compile in a plain submodule (only the root moddev project has the patched
// Minecraft classpath), so their sources are compiled here as part of the main
// mod. p.2.0.9: all MC-layer host shells (invadvopt / smoothboot / servercore /
// jec / itemban / c2me) moved into subterra-runtime as io.toterra.subterra.runtime.{optim,worldgen}
// and are mounted here once.
sourceSets {
    main {
        // p.2.0: MC-layer runtime source-host (launch/fix/worldgen wiring and
        // the optim-shell hosts land here).
        java.srcDir('subterra-runtime/src/main/java')
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// p.2.1 tie bridge: engine.tie uses stable FFM (java.lang.foreign), so the whole
// project aligns on Java 25 bytecode (L1 launch layer already requires a Java 25
// runtime on the dev/game JVM).
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // L1 launch package (p.1.1): inject the Subterra JVM argument package
        // before process start. Keep in sync with JvmLaunchArgs (runtime.launch);
        // the mod validates the presence of these flags at boot.
        configureEach {
            // API + engine cores are referenced by MC-layer source hosts
            // (e.g. the JEC pinyin search port uses engine.optim.logic.pronounce).
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create(project(':subterra-api')))
            // p.2.0.2: root MC layer references engine.worldgen classes in dev runs.
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create(project(':subterra-engine')))
            // NOTE: MC-layer source hosts (subterra-invadvopt) compile into the
            // root main source set and need no dev-run classpath injection.
            // p.2.0.7: launch/fix classes now live in the root main output — nothing to inject.

            jvmArguments.addAll([
                    '-XX:+UseZGC',
                    '-XX:InitialRAMPercentage=75',
                    '-XX:MaxRAMPercentage=75',
                    '-XX:+AlwaysPreTouch',
                    '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            ])
        }

        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // World profiler headless acceptance: forward the drive properties to the
            // game JVM (absent by default -> zero impact), e.g.
            // -Dsubterra.profile=8 -Dsubterra.profileBuild=true -Dsubterra.profileSlice=x:-32:32:block
            systemProperty 'subterra.profile', System.getProperty('subterra.profile', System.getenv('SUBTERRA_PROFILE') ?: '')
            systemProperty 'subterra.profileBuild', System.getProperty('subterra.profileBuild', System.getenv('SUBTERRA_PROFILE_BUILD') ?: '')
            systemProperty 'subterra.profileSlice', System.getProperty('subterra.profileSlice', System.getenv('SUBTERRA_PROFILE_SLICE') ?: '')
            systemProperty 'subterra.perfCount', System.getProperty('subterra.perfCount', System.getenv('SUBTERRA_PERF_COUNT') ?: '')
            systemProperty 'subterra.profileCenter', System.getProperty('subterra.profileCenter', System.getenv('SUBTERRA_PROFILE_CENTER') ?: '')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Fixed probe port: never collides with a regular MC server the user
            // may run, and lets the boot gate identify (and reap) its own game by port.
            programArgument '--port'
            programArgument '25599'
            // World profiler headless acceptance: forward the drive properties to the
            // game JVM (absent by default -> zero impact) so the runServer acceptance
            // driver (WorldProfileAcceptanceProbe) reaches the hook via -D as well as env.
            systemProperty 'subterra.profile', System.getProperty('subterra.profile', System.getenv('SUBTERRA_PROFILE') ?: '')
            systemProperty 'subterra.profileBuild', System.getProperty('subterra.profileBuild', System.getenv('SUBTERRA_PROFILE_BUILD') ?: '')
            systemProperty 'subterra.profileSlice', System.getProperty('subterra.profileSlice', System.getenv('SUBTERRA_PROFILE_SLICE') ?: '')
            systemProperty 'subterra.perfCount', System.getProperty('subterra.perfCount', System.getenv('SUBTERRA_PERF_COUNT') ?: '')
            systemProperty 'subterra.profileCenter', System.getProperty('subterra.profileCenter', System.getenv('SUBTERRA_PROFILE_CENTER') ?: '')
            // p.2.2 datapack runtime: td datapacks source dir (absent -> cwd/datapacks).
            systemProperty 'subterra.datapacks',
                    System.getProperty('subterra.datapacks', project.findProperty('subterra.datapacks') ?: System.getenv('SUBTERRA_DATAPACKS') ?: '')
            // p.2.2.9 save/session rules override file (absent -> no override).
            systemProperty 'subterra.override', System.getProperty('subterra.override', project.findProperty('subterra.override') ?: '')
            // p.2.2.7 deterministic E2E export hook: forward a target path to run the
            // export + rehydrate-identity core at startup (absent -> no auto-export).
            systemProperty 'subterra.probe.export',
                    System.getProperty('subterra.probe.export', project.findProperty('subterra.probe.export') ?: '')
            // p.2.3.2 deterministic E2E save hook: gate the level.dat -> zdt migration
            // shell at the ServerStartedEvent lifecycle (absent -> priority no-op).
            systemProperty 'subterra.probe.save',
                    System.getProperty('subterra.probe.save', project.findProperty('subterra.probe.save') ?: '')
            // p.2.4.6 deterministic E2E network hook: gate the enhanced-channel shell at the
            // ServerStartedEvent lifecycle (absent -> priority no-op).
            systemProperty 'subterra.probe.network',
                    System.getProperty('subterra.probe.network', project.findProperty('subterra.probe.network') ?: '')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // World profiler headless acceptance: forward the drive properties to the
            // game JVM (absent by default -> zero impact), e.g.
            // -Dsubterra.profile=8 -Dsubterra.profileBuild=true -Dsubterra.profileSlice=x:-32:32:block
            systemProperty 'subterra.profile', System.getProperty('subterra.profile', System.getenv('SUBTERRA_PROFILE') ?: '')
            systemProperty 'subterra.profileBuild', System.getProperty('subterra.profileBuild', System.getenv('SUBTERRA_PROFILE_BUILD') ?: '')
            systemProperty 'subterra.profileSlice', System.getProperty('subterra.profileSlice', System.getenv('SUBTERRA_PROFILE_SLICE') ?: '')
            systemProperty 'subterra.perfCount', System.getProperty('subterra.perfCount', System.getenv('SUBTERRA_PERF_COUNT') ?: '')
            systemProperty 'subterra.profileCenter', System.getProperty('subterra.profileCenter', System.getenv('SUBTERRA_PROFILE_CENTER') ?: '')
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // API + engine cores are referenced by MC-layer source hosts
    // (e.g. the JEC pinyin search port uses engine.optim.logic.pronounce).
    implementation project(':subterra-api')
    // p.2.0 pure-JDK engine core (worldgen/optim/config/log/export migrate into engine.*).
    implementation project(':subterra-engine')

    // JUnit 5 for the ported MC-layer source-host tests (subterra-invadvopt).
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    // NeoForge/FML rejects pre-release p.* versions in neoforge.mods.toml;
    // mirror the p-track as a parseable game version by stripping the "p." prefix.
    def modVersionGame = mod_version.replaceFirst('^p\\.', '')
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_version_game       : modVersionGame,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// p.1.8.17 same-seed authoritative compare bridge: samples the vanilla NoiseRouter density
// fields at fixed coordinates for a world seed and compares them against Subterra's pure-JDK
// mirror (SameSeedCompare in the ROOT main source set, so the MC classpath is present). Plain
// JavaExec runs the main class directly (no game launch): mirror + self-check run headless;
// the MC-sampling path needs a booted NeoForge server. CSV lands in run/compare/<seed>.csv.
tasks.register('runWorldCompare', JavaExec) {
    group = 'verification'
    description = 'p.1.8.17: compare vanilla NoiseRouter vs Subterra mirror on a shared seed (self-check headless; MC sampling needs a booted server).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.toterra.subterra.runtime.worldgen.compare.SameSeedCompare'
    workingDir = project.file('run')
    // Mirror the dev-run JVM tuning / reflection opens from runs.configureEach.
    jvmArguments.addAll([
            '-XX:+UseZGC',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
    ])
    // Overridable: gradle -Dsubterra.compareSeed=... / -Dsubterra.compareSelfCheck=true (JVM/IDE), or
    // -Psubterra.compareSeed=... / -Psubterra.compareSelfCheck=true for the Gradle daemon/CLI. Default off.
    systemProperty 'subterra.compareSeed',
            System.getProperty('subterra.compareSeed', project.findProperty('subterra.compareSeed') ?: '44905237')
    systemProperty 'subterra.compareSelfCheck',
            System.getProperty('subterra.compareSelfCheck', project.findProperty('subterra.compareSelfCheck') ?: 'false')
}
